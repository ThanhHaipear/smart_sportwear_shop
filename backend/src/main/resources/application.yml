spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dunghaiquyen}${DB_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  cache:
    type: caffeine

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        default_batch_fetch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
    # Shared Supabase DB carries migrations owned by other branches/services
    # (forecast-demo, orders-data-source, etc.) that this app doesn't ship.
    # Ignore both "applied-but-missing-locally" (other branches deleted/renamed a
    # migration) and "applied-beyond-local-max" (*:future — another branch/service
    # shipped a higher version to this shared DB) so validate doesn't fail on drift
    # this app doesn't own. It still validates and applies its own migrations.
    ignore-migration-patterns: "*:missing,*:future"
    validate-on-migrate: true

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s

  servlet:
    multipart:
      # Hard ceiling enforced by Spring's multipart resolver, ahead of any
      # controller code. ProductImageService's own business-rule check
      # (5MB, see validateImageFile) is tighter and is what most "file too
      # big" rejections actually hit - this is just the outer safety net.
      max-file-size: 8MB
      max-request-size: 9MB

  mail:
    # Plain Spring Boot mail config - only consumed when app.mail.provider=smtp
    # (SmtpMailService). Ignored by the default "logging" provider, so these
    # defaults are deliberately harmless (no real server at localhost:1025
    # is required to start the app or run tests).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:visual_search}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s

server:
  port: ${SERVER_PORT:8080}
  # Honor Forwarded/X-Forwarded-* only after the deployment proxy has sanitized
  # inbound forwarding headers. Session/user identity remains the visual-search
  # rate-limit key, with the resolved client address used by other web features.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

app:
  product-search:
    enabled: ${PRODUCT_HYBRID_SEARCH_ENABLED:false}
    service-url: ${PRODUCT_SEARCH_SERVICE_URL:http://127.0.0.1:8002}
    internal-token: ${PRODUCT_SEARCH_INTERNAL_TOKEN:change-me}
    timeout-seconds: ${PRODUCT_SEARCH_TIMEOUT_SECONDS:12}
    rate-limit-per-minute: ${PRODUCT_SEARCH_RATE_LIMIT_PER_MINUTE:30}
  visual-search:
    enabled: ${VISUAL_SEARCH_ENABLED:false}
    service-url: ${VISUAL_SEARCH_SERVICE_URL:http://127.0.0.1:8090}
    internal-token: ${VISUAL_SEARCH_INTERNAL_TOKEN:}
    # Legacy URL imports must use a host that the indexing worker can safely download.
    catalog-image-allowed-hosts: ${CATALOG_IMAGE_ALLOWED_HOSTS:res.cloudinary.com,cdn.shopify.com}
    request-timeout-seconds: ${VISUAL_SEARCH_REQUEST_TIMEOUT_SECONDS:15}
    rate-limit-per-minute: ${VISUAL_SEARCH_RATE_LIMIT_PER_MINUTE:10}
    outbox:
      poll-delay-ms: ${VISUAL_SEARCH_OUTBOX_POLL_DELAY_MS:1000}
      batch-size: ${VISUAL_SEARCH_OUTBOX_BATCH_SIZE:25}
      confirm-timeout-seconds: ${VISUAL_SEARCH_OUTBOX_CONFIRM_TIMEOUT_SECONDS:5}
      max-attempts: ${VISUAL_SEARCH_OUTBOX_MAX_ATTEMPTS:10}
  ai:
    sync-secret: ${AI_SYNC_SECRET:dev-only-ai-sync-secret-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-please-32-bytes-min}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-please-32-bytes}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  mail:
    # "logging" (default) keeps the existing log-only behavior - safe for any
    # fresh checkout/test run, no SMTP server needed. Switch to "smtp" to
    # actually send mail (SmtpMailService) - see README for Gmail setup.
    # Any other value (typo, etc.) means NEITHER MailService bean matches its
    # @ConditionalOnProperty, so the app fails to start with a clear
    # "no qualifying bean" error instead of silently picking the wrong one.
    provider: ${APP_MAIL_PROVIDER:logging}
    from: ${MAIL_FROM:no-reply@dunghaiquyen.local}
  order:
    pending-payment-expiry-minutes: ${ORDER_PENDING_EXPIRY_MINUTES:30}
    expiry-scan-delay-ms: ${ORDER_EXPIRY_SCAN_DELAY_MS:60000}
    expiry-scan-initial-delay-ms: ${ORDER_EXPIRY_SCAN_INITIAL_DELAY_MS:60000}
  notifications:
    stream:
      # SSE fan-out across instances via Redis pub/sub. Default OFF so a single
      # node starts with no Redis running â€” the broadcaster still delivers SSE
      # to that node's own streams locally. Set NOTIFICATIONS_STREAM_REDIS=true
      # only for a multi-instance deployment that actually has Redis available.
      redis-enabled: ${NOTIFICATIONS_STREAM_REDIS:false}
  google:
    # Google OAuth2 client ID - must match the Web Client ID in Google Cloud
    # Console for your project. Frontend sends a Google ID token; backend
    # verifies it and checks that its "aud" claim equals this value to prevent
    # token substitution attacks from other Google apps. Empty string (default)
    # is safe for local dev/tests that never call the Google login endpoint.
    client-id: ${GOOGLE_CLIENT_ID:}
    # Token verification endpoint - externalised so tests can override it to
    # point at a WireMock stub (application-test.yml sets this).
    token-info-url: ${GOOGLE_TOKENINFO_URL:https://oauth2.googleapis.com/tokeninfo}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEVTMN01}
    # Must never be empty: HMAC-SHA512 (VnpaySignatureService) rejects a
    # zero-length key outright (IllegalArgumentException), which previously
    # crashed any VNPAY flow - including this project's own seed data, caught
    # by actually running it - whenever this var was left unset outside the
    # test profile (application-test.yml has always set its own real value).
    hash-secret: ${VNPAY_HASH_SECRET:dev-only-vnpay-hash-secret-change-me-please}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${PAYMENT_RETURN_URL:http://localhost:3000/payment/result}
    callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
    transaction-api-url: ${VNPAY_TRANSACTION_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  report:
    # No threshold is given anywhere in the Phase 1 spec docs - 10 units
    # (available = stock - reserved) is this project's own default, tunable
    # without a redeploy. See ReportService javadoc for the full reasoning.
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}
  shipping:
    # No real shipping engine - flat fee waived once subtotal reaches the
    # free-shipping threshold. flat-fee defaults to 0, so existing behavior
    # (shippingFee always 0) is unchanged until an operator opts in.
    # free-shipping-threshold defaults effectively "unreachable" (NOT 0) -
    # a threshold of 0 would make every order qualify as free-shipping
    # immediately and silently swallow any flat-fee an operator configures,
    # which is the opposite of what "I just set a flat fee" should do.
    # Same rule used by both checkout (OrderService) and the checkout preview -
    # see OrderService.calculateShippingFee.
    flat-fee: ${SHIPPING_FLAT_FEE:0}
    free-shipping-threshold: ${SHIPPING_FREE_THRESHOLD:999999999999}
  password-reset:
    # PHASE1_SPEC.md 6.1 suggests 15 minutes explicitly.
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/dat-lai-mat-khau}
  seed:
    # Deliberately opt-in: demo data must not be auto-created on every normal
    # app start. Run with --app.seed.enabled=true when you explicitly want it.
    enabled: ${APP_SEED_ENABLED:false}
    demo-password: ${APP_SEED_DEMO_PASSWORD:Password123}
  forecast-demo:
    enabled: ${FORECAST_DEMO_ENABLED:false}
    random-seed: ${FORECAST_DEMO_RANDOM_SEED:20260725}
    anchor-date: ${FORECAST_DEMO_ANCHOR_DATE:2026-07-24}
    history-days: ${FORECAST_DEMO_HISTORY_DAYS:180}
    order-count: ${FORECAST_DEMO_ORDER_COUNT:12000}
    variant-count: ${FORECAST_DEMO_VARIANT_COUNT:120}
    marker: ${FORECAST_DEMO_MARKER:[FORECAST_DEMO_V2]}
    cleanup-before-seed: ${FORECAST_DEMO_CLEANUP:true}
    smooth-variants: ${FORECAST_DEMO_SMOOTH_VARIANTS:20}
    normal-variants: ${FORECAST_DEMO_NORMAL_VARIANTS:20}
    slow-variants: ${FORECAST_DEMO_SLOW_VARIANTS:15}
    intermittent-variants: ${FORECAST_DEMO_INTERMITTENT_VARIANTS:20}
    erratic-variants: ${FORECAST_DEMO_ERRATIC_VARIANTS:15}
    growing-variants: ${FORECAST_DEMO_GROWING_VARIANTS:10}
    declining-variants: ${FORECAST_DEMO_DECLINING_VARIANTS:10}
    new-item-variants: ${FORECAST_DEMO_NEW_ITEM_VARIANTS:5}
    no-demand-variants: ${FORECAST_DEMO_NO_DEMAND_VARIANTS:5}
    weekend-multiplier: ${FORECAST_DEMO_WEEKEND_MULTIPLIER:1.30}
    promotion-multiplier: ${FORECAST_DEMO_PROMOTION_MULTIPLIER:3.00}
    promotion-day-of-month: ${FORECAST_DEMO_PROMOTION_DAY_OF_MONTH:15}
    new-item-history-days: ${FORECAST_DEMO_NEW_ITEM_HISTORY_DAYS:30}
    cancel-rate: ${FORECAST_DEMO_CANCEL_RATE:0.05}
    inventory-history-enabled: ${FORECAST_DEMO_INVENTORY_HISTORY_ENABLED:true}
    inventory-history-days: ${FORECAST_DEMO_INVENTORY_HISTORY_DAYS:180}
    supplier-count: ${FORECAST_DEMO_SUPPLIER_COUNT:3}
    min-lead-time-days: ${FORECAST_DEMO_MIN_LEAD_TIME_DAYS:7}
    max-lead-time-days: ${FORECAST_DEMO_MAX_LEAD_TIME_DAYS:30}
    default-service-level: ${FORECAST_DEMO_DEFAULT_SERVICE_LEVEL:0.95}
    ground-truth-enabled: ${FORECAST_DEMO_GROUND_TRUTH_ENABLED:true}
    scenario-version: ${FORECAST_DEMO_SCENARIO_VERSION:synthetic-v2}
  storage:
    provider: ${APP_STORAGE_PROVIDER:none}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

info:
  app:
    name: Smart Sportswear Shop Backend
    phase: Phase 1
    docs: /swagger-ui/index.html
    health: /actuator/health

logging:
  level:
    com.dunghaiquyen.ecommerce: ${LOG_LEVEL:INFO}

synthetic:
  data:
    allowed: ${SYNTHETIC_DATA_ALLOWED:false}
    environment: ${SYNTHETIC_DATA_ENVIRONMENT:development}
