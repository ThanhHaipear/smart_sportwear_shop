# Test-only overrides, layered on top of the main application.yml (profile
# "test" merges, it does not replace).
#
# This profile is intentionally environment-driven: set TEST_DB_URL /
# TEST_DB_USERNAME / TEST_DB_PASSWORD explicitly. That keeps the suite usable
# with Supabase or any dedicated Postgres instance, and avoids silently
# coupling tests to a local Docker database the caller may not even use.
#
# Hikari pool size is bumped so the one-time-use concurrency test (10 parallel
# /refresh calls, one of which can transiently hold 2 connections via
# REQUIRES_NEW) does not flake on pool exhaustion under MockMvc's
# thread-per-call execution.
spring:
  cache:
    type: none
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20

# No real VNPay sandbox account exists for this project - tests sign their own
# callback payloads with the same VnpaySignatureService bean (autowired in
# PaymentIntegrationTest), so only a deterministic, non-blank secret matters
# here, not a real merchant credential.
app:
  # Never let a developer's backend/.env route automated tests to real SMTP.
  # Notification integration tests verify persisted delivery state using the
  # deterministic logging provider.
  mail:
    provider: logging
  vnpay:
    tmn-code: TESTTMN1
    hash-secret: test-only-vnpay-hash-secret-do-not-use-in-prod
