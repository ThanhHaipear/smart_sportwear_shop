openapi: 3.0.3
info: {title: Catalog Service Internal API, version: 1.0.0}
paths:
  /internal/v1/variants/{id}/sale-snapshot:
    get:
      security: [{serviceToken: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Immutable sale-time snapshot}, '404': {description: Variant not found}}
  /internal/v1/products/{id}/index-document:
    get:
      security: [{serviceToken: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Versioned Search indexing document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogIndexDocument'}
        '404': {description: Product not found}
  /internal/v1/inventory/reservations:
    post:
      security: [{serviceToken: []}]
      responses: {'201': {description: Reserved atomically}, '409': {description: Not saleable or insufficient inventory}}
  /internal/v1/inventory/reservations/{id}/confirm:
    post:
      security: [{serviceToken: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Reservation confirmed idempotently}}
  /internal/v1/inventory/reservations/{id}:
    delete:
      security: [{serviceToken: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Reservation released idempotently}}
components:
  securitySchemes:
    serviceToken: {type: apiKey, in: header, name: X-Internal-Service-Token}
  schemas:
    CatalogIndexDocument:
      type: object
      additionalProperties: false
      required: [productId, sourceVersion, status, name, description, sportCodes, attributes, variants, images]
      properties:
        productId: {type: string, format: uuid}
        sourceVersion: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [DRAFT, ACTIVE, INACTIVE]}
        name: {type: string}
        description: {type: string}
        categoryId: {type: string, format: uuid, nullable: true}
        category: {type: string, nullable: true}
        categorySlug: {type: string, nullable: true}
        brandId: {type: string, format: uuid, nullable: true}
        brand: {type: string, nullable: true}
        brandSlug: {type: string, nullable: true}
        productType: {type: string, nullable: true}
        gender: {type: string, nullable: true}
        sportCodes: {type: array, items: {type: string}}
        attributes: {type: object, additionalProperties: true}
        variants: {type: array, items: {$ref: '#/components/schemas/CatalogIndexVariant'}}
        images: {type: array, items: {$ref: '#/components/schemas/CatalogIndexImage'}}
    CatalogIndexVariant:
      type: object
      additionalProperties: false
      required: [id, sku, price, availableQuantity, status]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        size: {type: string, nullable: true}
        color: {type: string, nullable: true}
        colorFamily: {type: string, nullable: true}
        price: {type: number, minimum: 0}
        availableQuantity: {type: integer}
        status: {type: string}
    CatalogIndexImage:
      type: object
      additionalProperties: false
      required: [id, url, sortOrder]
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        publicId: {type: string, nullable: true}
        sortOrder: {type: integer, minimum: 0}
