openapi: 3.1.0
info:
  title: Smart Sportswear Recommendation Service
  version: 1.0.0
paths:
  /api/v1/recommendations/products/{product_id}:
    get:
      summary: Recommend products related to one product
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Ranked recommendations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResponse' }
  /api/v1/recommendations/cart:
    post:
      summary: Recommend from the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceProductIds]
              properties:
                sourceProductIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                limit: { type: [integer, 'null'], minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Ranked recommendations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResponse' }
  /api/v1/recommendations/interactions:
    post:
      summary: Record an idempotent versioned interaction event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserInteractionEvent' }
      responses:
        '202': { description: Accepted or already processed }
        '422': { description: 'Invalid interaction or its data source is disabled by service configuration.' }
        '429': { description: Rate limit exceeded (counted per event, per identity and per IP) }
  /api/v1/recommendations/interactions/batch:
    post:
      summary: Record up to 10 interaction events from one browser in a single request
      description: >
        All-or-nothing validation; every event must share the same anonymousId and have a unique
        eventId. Events are stored idempotently in one transaction. The rate limit is charged per event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              additionalProperties: false
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/BrowserInteractionEvent' }
      responses:
        '202':
          description: Batch stored; duplicates are counted but not stored again
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates, eventIds]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  duplicates: { type: integer, minimum: 0 }
                  eventIds: { type: array, items: { type: string, format: uuid } }
        '422': { description: Invalid batch (any invalid event rejects the whole batch) }
        '429': { description: Rate limit exceeded }
  /internal/v1/events:
    post:
      summary: Apply a versioned integration event idempotently
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Processed or already processed }
        '401': { description: Invalid service token }
components:
  securitySchemes:
    serviceToken: { type: apiKey, in: header, name: X-Internal-Service-Token }
  schemas:
    ProductSnapshot:
      type: object
      required: [id, name, slug, availableQuantity, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        thumbnailUrl: { type: [string, 'null'] }
        minPrice: { type: [number, 'null'] }
        maxPrice: { type: [number, 'null'] }
        availableQuantity: { type: integer }
        status: { type: string }
    RecommendationItem:
      type: object
      required: [product, score, algorithm, reason]
      properties:
        product: { $ref: '#/components/schemas/ProductSnapshot' }
        score: { type: number }
        algorithm: { type: string }
        reason: { type: string }
        support: { type: number }
        confidence: { type: number }
        lift: { type: number }
        pairCount: { type: integer }
    RecommendationResponse:
      type: object
      required: [requestId, sourceProductIds, type, modelVersion, items]
      properties:
        requestId: { type: string, format: uuid }
        sourceProductId: { type: [string, 'null'], format: uuid }
        sourceProductIds: { type: array, items: { type: string, format: uuid } }
        type: { type: string }
        modelVersion: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/RecommendationItem' } }
    BrowserInteractionEvent:
      type: object
      description: >
        Event sent by the storefront. REAL uses the Gateway-verified X-User-Id, when present. DEMO requires
        anonymousId and never stores an account ID. Browser-supplied userRef is ignored and
        occurredAt is replaced by the server receive time. metadata is limited to an allow-list per eventType
        (review R4, data minimisation per O01): unknown fields or wrong types reject the event with 422, and
        reject the whole batch on the batch endpoint. Null metadata values are not stored.
      required: [eventId, eventType, eventVersion, occurredAt, traceId, source, dataSource]
      properties:
        eventId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [VIEW, ADD_TO_CART, WISHLIST, SEARCH_IMPRESSION, SEARCH_CLICK,
                 RECOMMENDATION_IMPRESSION, RECOMMENDATION_CLICK]
        eventVersion: { type: integer }
        occurredAt: { type: string, format: date-time }
        traceId: { type: string, minLength: 1, maxLength: 128 }
        anonymousId: { type: [string, 'null'], pattern: '^[A-Za-z0-9._:-]{8,100}$' }
        productId: { type: [string, 'null'], format: uuid }
        variantId: { type: [string, 'null'], format: uuid }
        requestId: { type: [string, 'null'], format: uuid, description: Required for RECOMMENDATION_* events }
        source: { type: string, minLength: 1, maxLength: 50 }
        dataSource:
          type: string
          enum: [REAL, DEMO]
          description: Each source is disabled by default. Enable DEMO with INTERACTION_DEMO_ENABLED or REAL with INTERACTION_REAL_ENABLED.
        metadata: { type: object, maxProperties: 5 }
      allOf:
        - if: { properties: { eventType: { enum: [VIEW, WISHLIST] } } }
          then: { properties: { metadata: { $ref: '#/components/schemas/NoMetadata' } } }
        - if: { properties: { eventType: { const: ADD_TO_CART } } }
          then: { properties: { metadata: { $ref: '#/components/schemas/AddToCartMetadata' } } }
        - if: { properties: { eventType: { enum: [SEARCH_IMPRESSION, SEARCH_CLICK] } } }
          then: { properties: { metadata: { $ref: '#/components/schemas/PositionMetadata' } } }
        - if: { properties: { eventType: { enum: [RECOMMENDATION_IMPRESSION, RECOMMENDATION_CLICK] } } }
          then: { properties: { metadata: { $ref: '#/components/schemas/RecommendationFeedbackMetadata' } } }
    NoMetadata:
      type: object
      additionalProperties: false
    PositionMetadata:
      type: object
      additionalProperties: false
      properties:
        position: { type: [integer, 'null'], minimum: 0, maximum: 99 }
    AddToCartMetadata:
      type: object
      additionalProperties: false
      properties:
        quantity: { type: [integer, 'null'], minimum: 1, maximum: 99 }
    RecommendationFeedbackMetadata:
      type: object
      additionalProperties: false
      description: The server-side recommendation request provides the source products through requestId. Older clients may send one of the deprecated source fields.
      properties:
        position: { type: [integer, 'null'], minimum: 0, maximum: 99 }
        algorithm: { type: [string, 'null'], enum: [ASSOCIATION_RULE, SIMILAR_CONTENT, POPULARITY, null] }
        modelVersion: { type: [string, 'null'], minLength: 1, maxLength: 50, deprecated: true, description: Accepted for older clients and discarded. Join requestId to the server-side recommendation request for attribution. }
        sourceProductId: { type: [string, 'null'], format: uuid, deprecated: true }
        sourceProductIds:
          type: [array, 'null']
          deprecated: true
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
