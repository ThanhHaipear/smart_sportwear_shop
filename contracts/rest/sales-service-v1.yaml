openapi: 3.0.3
info: {title: Smart Sportswear Sales Service, version: 1.0.0}
paths:
  /api/v1/orders:
    post:
      summary: Create a COD or VietQR order using Catalog snapshots and reservation
      operationId: createOrder
      parameters:
        - {in: header, name: Authorization, required: true, schema: {type: string}, description: Identity access JWT; enforced by the routed gateway/core until Phase 9 cut-over}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrder'}}}}
      responses: {'201': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}}
  /api/v1/webhooks/sepay:
    post:
      summary: SePay ingress; signature is verified against exact request bytes
      operationId: ingestSePayWebhook
      parameters:
        - {in: header, name: X-SePay-Signature, required: true, schema: {type: string}}
        - {in: header, name: X-SePay-Timestamp, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'200': {description: Duplicate already committed}, '201': {description: Newly committed}, '401': {description: Invalid signature}}
  /internal/v1/refunds:
    post:
      summary: Create a bounded refund against a paid Sales payment
      operationId: createRefund
      parameters:
        - {in: header, name: X-Internal-Service-Token, required: true, schema: {type: string}}
        - {in: header, name: X-Actor-Id, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRefund'}}}}
      responses: {'201': {description: Pending refund}}
components:
  schemas:
    CreateOrder:
      type: object
      required: [userId, items, paymentMethod, address]
      properties:
        userId: {type: string, format: uuid}
        items: {type: array, minItems: 1, items: {type: object, required: [variantId, quantity], properties: {variantId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}
        paymentMethod: {type: string, enum: [COD, VIETQR]}
        address: {type: object}
        shippingFee: {type: number, minimum: 0}
        note: {type: string}
    Order:
      type: object
      required: [id, orderCode, orderStatus, paymentStatus, paymentMethod, total]
      properties:
        id: {type: string, format: uuid}
        orderCode: {type: string}
        orderStatus: {type: string}
        paymentStatus: {type: string}
        paymentMethod: {type: string, enum: [COD, VIETQR]}
        total: {type: number}
        transactionRef: {type: string}
        paymentExpiresAt: {type: string, format: date-time, nullable: true}
    CreateRefund:
      type: object
      required: [orderId, paymentId, amount, reason]
      properties:
        orderId: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        amount: {type: number, exclusiveMinimum: true, minimum: 0}
        reason: {type: string}
        bankCode: {type: string}
        bankName: {type: string}
        accountNumber: {type: string}
        accountName: {type: string}
