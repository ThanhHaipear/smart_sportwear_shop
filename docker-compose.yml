services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-visual_search}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  search-service:
    profiles: ["search", "chatbot"]
    build: ./services/search-service
    expose: ["8090"]
    env_file: ./services/search-service/.env.example
    environment:
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      VISUAL_SEARCH_ENABLED: ${VISUAL_SEARCH_ENABLED:-false}
      DATABASE_URL: ${SEARCH_DATABASE_URL:-}
      INTERNAL_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      CATALOG_SERVICE_TOKEN: ${CATALOG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CATALOG_API_URL: http://catalog-service:8092
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-visual_search}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  search-worker:
    profiles: ["search", "chatbot"]
    build: ./services/search-service
    command: ["python", "-m", "app.worker"]
    env_file: ./services/search-service/.env.example
    environment:
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      VISUAL_SEARCH_ENABLED: ${VISUAL_SEARCH_ENABLED:-false}
      DATABASE_URL: ${SEARCH_DATABASE_URL:-}
      INTERNAL_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      CATALOG_SERVICE_TOKEN: ${CATALOG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CATALOG_API_URL: http://catalog-service:8092
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-visual_search}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  chatbot-service:
    profiles: ["chatbot"]
    build: ./chatbot-service
    expose: ["8002"]
    env_file: ./chatbot-service/.env.example
    environment:
      SEARCH_API_BASE_URL: http://search-service:8090
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      CATALOG_API_BASE_URL: http://catalog-service:8092
      CATALOG_SERVICE_TOKEN: ${CATALOG_INTERNAL_TOKEN:-}
      CHATBOT_DATABASE_URL: ${CHATBOT_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      search-service:
        condition: service_started
    restart: unless-stopped

  recommendation-service:
    profiles: ["recommendation"]
    build: ./recommendation-service
    expose: ["8091"]
    env_file: ./recommendation-service/.env.example
    environment:
      RECOMMENDATION_ENABLED: ${RECOMMENDATION_ENABLED:-false}
      RECOMMENDATION_DATABASE_URL: ${RECOMMENDATION_DATABASE_URL:-}
      RECOMMENDATION_INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-visual_search}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  recommendation-worker:
    profiles: ["recommendation"]
    build: ./recommendation-service
    command: ["python", "-m", "app.worker"]
    env_file: ./recommendation-service/.env.example
    environment:
      RECOMMENDATION_ENABLED: ${RECOMMENDATION_ENABLED:-false}
      RECOMMENDATION_DATABASE_URL: ${RECOMMENDATION_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-visual_search}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  catalog-service:
    profiles: ["catalog"]
    build: ./catalog-service
    expose: ["8092"]
    env_file: ./catalog-service/.env.example
    environment:
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/dunghaiquyen?currentSchema=catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog_app}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-change-me}
      CATALOG_MIGRATION_DATABASE_URL: ${CATALOG_MIGRATION_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/dunghaiquyen}
      CATALOG_MIGRATION_DB_USERNAME: ${CATALOG_MIGRATION_DB_USERNAME:-postgres}
      CATALOG_MIGRATION_DB_PASSWORD: ${CATALOG_MIGRATION_DB_PASSWORD:-change-me}
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:-change-me}
      SALES_API_BASE_URL: http://sales-service:8094
      SALES_INTERNAL_TOKEN: ${SALES_INTERNAL_TOKEN:-change-me}
      CATALOG_IMAGE_STORAGE_DIRECTORY: /var/lib/catalog/images
      CATALOG_EVENTS_ENABLED: ${CATALOG_EVENTS_ENABLED:-false}
      CATALOG_FLYWAY_ENABLED: ${CATALOG_FLYWAY_ENABLED:-false}
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-visual_search}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
    volumes:
      - catalog_images:/var/lib/catalog/images
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  identity-service:
    profiles: ["identity"]
    build: ./identity-service
    expose: ["8093"]
    env_file: ./identity-service/.env.example
    environment:
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/dunghaiquyen?currentSchema=identity}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:-identity_app}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-change-me}
      IDENTITY_MIGRATION_DATABASE_URL: ${IDENTITY_MIGRATION_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/dunghaiquyen}
      IDENTITY_MIGRATION_DB_USERNAME: ${IDENTITY_MIGRATION_DB_USERNAME:-postgres}
      IDENTITY_MIGRATION_DB_PASSWORD: ${IDENTITY_MIGRATION_DB_PASSWORD:-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-please-32-bytes-min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-please-32-bytes}
      JWT_PREVIOUS_ACCESS_SECRET: ${JWT_PREVIOUS_ACCESS_SECRET:-}
      JWT_PREVIOUS_REFRESH_SECRET: ${JWT_PREVIOUS_REFRESH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      IDENTITY_EVENTS_ENABLED: ${IDENTITY_EVENTS_ENABLED:-false}
      SALES_INTERNAL_TOKEN: ${SALES_INTERNAL_TOKEN:-change-me}
      IDENTITY_FLYWAY_ENABLED: ${IDENTITY_FLYWAY_ENABLED:-false}
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-visual_search}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  sales-service:
    profiles: ["sales"]
    build: ./sales-service
    expose: ["8094"]
    env_file: ./sales-service/.env.example
    environment:
      SALES_DATABASE_URL: ${SALES_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/dunghaiquyen?currentSchema=sales}
      SALES_DB_USERNAME: ${SALES_DB_USERNAME:-sales_app}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:-change-me}
      SALES_MIGRATION_DATABASE_URL: ${SALES_MIGRATION_DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/dunghaiquyen}
      SALES_MIGRATION_DB_USERNAME: ${SALES_MIGRATION_DB_USERNAME:-postgres}
      SALES_MIGRATION_DB_PASSWORD: ${SALES_MIGRATION_DB_PASSWORD:-change-me}
      SALES_INTERNAL_TOKEN: ${SALES_INTERNAL_TOKEN:-change-me}
      CATALOG_API_BASE_URL: http://catalog-service:8092
      IDENTITY_API_BASE_URL: http://identity-service:8093
      CATALOG_INTERNAL_TOKEN: ${CATALOG_INTERNAL_TOKEN:-change-me}
      SEPAY_WEBHOOK_ENABLED: ${SEPAY_WEBHOOK_ENABLED:-false}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-change-me}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:-}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
      SALES_EVENTS_ENABLED: ${SALES_EVENTS_ENABLED:-false}
      SALES_FLYWAY_ENABLED: ${SALES_FLYWAY_ENABLED:-false}
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-visual_search}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-me}
    depends_on:
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    profiles: ["gateway"]
    build: ./gateway
    ports:
      - "${GATEWAY_PUBLIC_PORT:-8080}:8080"
    env_file: ./gateway/.env.example
    environment:
      IDENTITY_UPSTREAM: http://identity-service:8093
      CATALOG_UPSTREAM: http://catalog-service:8092
      SALES_UPSTREAM: http://sales-service:8094
      CHATBOT_UPSTREAM: http://chatbot-service:8002
      RECOMMENDATION_UPSTREAM: http://recommendation-service:8091
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-10}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-120}
      GATEWAY_RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST:-30}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-please-32-bytes-min}
      JWT_PREVIOUS_ACCESS_SECRET: ${JWT_PREVIOUS_ACCESS_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    expose: ["3200", "4317", "4318"]
    restart: unless-stopped

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    expose: ["4317", "4318"]
    depends_on:
      - tempo
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  catalog_images:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  tempo_data:
  grafana_data:
