services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-visual_search}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  search-service:
    profiles: ["search", "chatbot"]
    build: ./services/search-service
    ports:
      - "8090:8090"
    env_file: ./services/search-service/.env.example
    environment:
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      DATABASE_URL: ${SEARCH_DATABASE_URL:-}
      INTERNAL_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CATALOG_API_URL: http://host.docker.internal:8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-visual_search}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  search-worker:
    profiles: ["search", "chatbot"]
    build: ./services/search-service
    command: ["python", "-m", "app.worker"]
    env_file: ./services/search-service/.env.example
    environment:
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      DATABASE_URL: ${SEARCH_DATABASE_URL:-}
      INTERNAL_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CATALOG_API_URL: http://host.docker.internal:8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-visual_search}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  chatbot-service:
    profiles: ["chatbot"]
    build: ./chatbot-service
    ports:
      - "8002:8002"
    env_file: ./chatbot-service/.env.example
    environment:
      SEARCH_API_BASE_URL: http://search-service:8090
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      CATALOG_API_BASE_URL: http://host.docker.internal:8080
      CATALOG_SERVICE_TOKEN: ${SEARCH_SERVICE_INTERNAL_TOKEN:-}
      CHATBOT_DATABASE_URL: ${CHATBOT_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      search-service:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
