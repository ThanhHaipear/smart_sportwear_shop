global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8093"]
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8092"]
  - job_name: sales-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sales-service:8094"]
  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service:8090"]
  - job_name: chatbot-service
    metrics_path: /metrics
    static_configs:
      - targets: ["chatbot-service:8002"]
  - job_name: recommendation-service
    metrics_path: /metrics
    static_configs:
      - targets: ["recommendation-service:8091"]

